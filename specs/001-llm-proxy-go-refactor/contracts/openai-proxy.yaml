openapi: 3.0.3
info:
  title: LLM Proxy API
  description: OpenAI-compatible proxy for multiple LLM providers
  version: 1.0.0

servers:
  - url: https://api.proxy.example.com/v1

paths:
  /chat/completions:
    post:
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  example: gpt-4
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [system, user, assistant]
                      content:
                        type: string
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                max_tokens:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Successful chat completion
        '400':
          description: Invalid request
        '500':
          description: Provider error
