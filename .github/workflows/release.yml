name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'

jobs:
  # Create release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: |
          mkdir -p build
          VERSION=${GITHUB_REF#refs/tags/v}

          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o build/go-llm-proxy-linux-amd64 cmd/proxy/main.go
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o build/go-llm-proxy-linux-arm64 cmd/proxy/main.go
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o build/go-llm-proxy-darwin-amd64 cmd/proxy/main.go
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=${VERSION}" -o build/go-llm-proxy-darwin-arm64 cmd/proxy/main.go
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${VERSION}" -o build/go-llm-proxy-windows-amd64.exe cmd/proxy/main.go

          # Create checksums
          cd build
          sha256sum * > checksums.txt

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## Changes in this Release

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Downloads

            - go-llm-proxy-linux-amd64
            - go-llm-proxy-linux-arm64
            - go-llm-proxy-darwin-amd64
            - go-llm-proxy-darwin-arm64
            - go-llm-proxy-windows-amd64.exe

            ## Verification

            All binaries are signed with SHA256 checksums. Verify the integrity of your download using the checksums.txt file.

            ```bash
            sha256sum -c checksums.txt
            ```

  # Upload binaries
  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: build/

      - name: Upload binaries to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: build/
          asset_name: go-llm-proxy-${{ github.ref_name }}-binaries
          asset_content_type: application/octet-stream

  # Build and push Docker image
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: go-llm-proxy
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
