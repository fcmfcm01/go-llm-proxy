apiVersion: v1
kind: Secret
metadata:
  name: llm-proxy-secret
  namespace: llm-proxy
  labels:
    app: llm-proxy
type: Opaque
data:
  # These values should be base64 encoded
  # Use: echo -n "value" | base64
  session-secret: ""
  tls-cert: ""
  tls-key: ""
  grafana-admin-password: ""
  redis-password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-proxy-tls
  namespace: llm-proxy
  labels:
    app: llm-proxy
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
