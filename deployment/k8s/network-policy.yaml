apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-proxy-network-policy
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  podSelector:
    matchLabels:
      app: llm-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from nginx ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Allow ingress from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Allow intra-namespace communication
  - from:
    - namespaceSelector:
        matchLabels:
          name: llm-proxy
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS outbound
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for health checks
  - to: []
    ports:
    - protocol: TCP
      port: 80
