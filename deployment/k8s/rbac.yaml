apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-proxy
  namespace: llm-proxy
  labels:
    app: llm-proxy
automountServiceAccountToken: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-proxy-pdb
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: llm-proxy
  name: llm-proxy
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-proxy
  namespace: llm-proxy
subjects:
- kind: ServiceAccount
  name: llm-proxy
  namespace: llm-proxy
roleRef:
  kind: Role
  name: llm-proxy
  apiGroup: rbac.authorization.k8s.io
