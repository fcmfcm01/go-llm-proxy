apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-proxy-data-pvc
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-proxy-logs-pvc
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-proxy-backup-pvc
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
