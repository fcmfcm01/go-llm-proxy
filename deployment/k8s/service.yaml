apiVersion: v1
kind: Service
metadata:
  name: llm-proxy
  namespace: llm-proxy
  labels:
    app: llm-proxy
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: llm-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy-headless
  namespace: llm-proxy
  labels:
    app: llm-proxy
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: https
    port: 8443
    targetPort: https
    protocol: TCP
  selector:
    app: llm-proxy
