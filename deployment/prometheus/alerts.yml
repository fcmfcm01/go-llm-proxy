groups:
  - name: llm-proxy-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(llm_proxy_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 0.1)"

      # Critical error rate
      - alert: CriticalErrorRate
        expr: rate(llm_proxy_errors_total[5m]) > 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 0.5)"

      # High request latency (p95)
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(llm_proxy_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "p95 latency is {{ $value }} seconds (threshold: 5s)"

      # Critical request latency
      - alert: CriticalRequestLatency
        expr: histogram_quantile(0.95, rate(llm_proxy_request_duration_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical request latency detected"
          description: "p95 latency is {{ $value }} seconds (threshold: 10s)"

      # High number of requests in flight
      - alert: HighRequestsInFlight
        expr: llm_proxy_requests_in_flight > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of requests in flight"
          description: "Currently {{ $value }} requests in flight (threshold: 100)"

      # No healthy providers
      - alert: NoHealthyProviders
        expr: llm_proxy_health_healthy_providers == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No healthy providers available"
          description: "All providers are unhealthy - service is degraded"

      # Low number of healthy providers
      - alert: LowHealthyProviders
        expr: llm_proxy_health_healthy_providers < 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Low number of healthy providers"
          description: "Only {{ $value }} providers are healthy (recommendation: at least 2)"

      # High provider failover rate
      - alert: HighFailoverRate
        expr: rate(llm_proxy_failed_over_requests_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High failover rate detected"
          description: "Failover rate is {{ $value }} requests/sec"

      # High retry rate
      - alert: HighRetryRate
        expr: rate(llm_proxy_retried_requests_total[5m]) > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High retry rate detected"
          description: "Retry rate is {{ $value }} requests/sec"

      # Provider health check failures
      - alert: ProviderHealthCheckFailures
        expr: rate(llm_proxy_health_checks_total{result="unhealthy"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Provider health check failures"
          description: "Provider {{ $labels.provider }} has {{ $value }} failed health checks"

      # High provider response time
      - alert: HighProviderResponseTime
        expr: histogram_quantile(0.95, rate(llm_proxy_provider_request_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High provider response time"
          description: "Provider {{ $labels.provider }} p95 response time is {{ $value }} seconds"

      # Very high response size
      - alert: VeryHighResponseSize
        expr: rate(llm_proxy_response_size_bytes_sum[5m]) / rate(llm_proxy_response_size_bytes_count[5m]) > 10000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Very high response size"
          description: "Average response size is {{ $value }} bytes (~10MB)"

      # No requests
      - alert: NoRequests
        expr: rate(llm_proxy_requests_total[5m]) == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "No requests received"
          description: "No requests in the last 10 minutes - service may be idle or down"

      # Instance down
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance down"
          description: "LLM Proxy instance is down"
